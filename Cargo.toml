[package]
name = "ghaf-device-manager"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"
description = "Crosvm device hotplug manager for Ghaf"

[dependencies]
anyhow = "1.0"
async-trait = "0.1"
clap = { version = "4.5", features = ["derive"] }
futures-util = { version = "0.3", features = ["sink"] }
nix = { version = "0.31", features = ["ioctl", "fs", "user"] }
regex = "1.12"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.48", features = ["full"] }
tokio-vsock = "0.7"
tokio-util = { version = "0.7", features = ["codec"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
udev = "0.9"
vsock = "0.5"

[dev-dependencies]
tempfile = "3.23"

[profile.release]
lto = "thin"
strip = true

[[bin]]
name = "ghaf-device-manager"
path = "src/bin/ghaf-device-manager.rs"

[[bin]]
name = "ghaf-device"
path = "src/bin/ghaf-device.rs"
