name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v30
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      # The flake source is the git tree, so a file that was never committed
      # fails here the same way it fails for a packager.
      - name: Package builds and its tests pass
        run: nix build .#default -L

      - name: Clippy
        run: nix develop --command cargo clippy --all-targets --all-features -- -D warnings

      - name: Rust formatting
        run: nix develop --command cargo fmt --all -- --check

      - name: Nix formatting
        run: nix fmt -- --check flake.nix nix/package.nix

      - name: Licensing
        run: nix develop --command reuse lint

      - name: Advisories
        run: nix develop --command cargo audit --deny warnings
